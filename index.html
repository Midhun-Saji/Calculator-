<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator App</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="./images/calc.png">
</head>
<body>
  <div class="calculator">
    <div id="display">0</div>
    <div class="buttons">
      <!-- Top row -->
      <button class="clear">C</button>
      <button class="back">&#9003;</button>
      <button>(</button>
      <button>)</button>

      <!-- Number rows -->

      <button>7</button>
      <button>8</button>
      <button>9</button>
      <button class="operator">/</button>

      <button>4</button>
      <button>5</button>
      <button>6</button>
      <button class="operator">*</button>

      <button>1</button>
      <button>2</button>
      <button>3</button>
      <button class="operator">-</button>

      <button>0</button>
      <button>.</button>
      <button class="equal">=</button>
      <button class="operator">+</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
